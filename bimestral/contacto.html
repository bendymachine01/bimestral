<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | ZØREN</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-black text-white">

<header>
    <nav class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">

        <a href="index.html" class="text-2xl font-bold">ZØREN</a>

        <div class="flex gap-6 text-gray-400">
            <a href="index.html">Inicio</a>
            <a href="musica.html">Música</a>
            <a href="eventos.html">Eventos</a>
            <a href="galeria.html">Galería</a>
            <a href="contacto.html" class="text-white">Contacto</a>
            <a href="acceso.html">Acceso</a>
        </div>

    </nav>
</header>

<main class="max-w-4xl mx-auto px-6 py-20">

    <h1 class="text-5xl font-bold mb-4">
        Contacto
    </h1>

    <p class="text-gray-400 mb-12">
        Puedes contactarme para eventos, canciones o colaboraciones.
    </p>

    <div class="grid md:grid-cols-3 gap-6 mb-12">

        <div class="card">
            <h2 class="text-xl font-bold mb-2">
                Programar un evento
            </h2>

            <p class="text-gray-400">
                Invita a ZØREN a tu evento.
            </p>
        </div>

        <div class="card">
            <h2 class="text-xl font-bold mb-2">
                Vender una canción
            </h2>

            <p class="text-gray-400">
                Solicita una canción para tu proyecto.
            </p>
        </div>

        <div class="card">
            <h2 class="text-xl font-bold mb-2">
                Colaboración
            </h2>

            <p class="text-gray-400">
                Propón una colaboración musical.
            </p>
        </div>

    </div>

    <form class="space-y-6">

        <div>
            <label>Nombre</label>
            <input type="text" class="form-input" placeholder="Tu nombre">
        </div>

        <div>
            <label>Correo</label>
            <input type="email" class="form-input" placeholder="correo@ejemplo.com">
        </div>

        <div>
            <label>Tipo de solicitud</label>

            <select id="tipo" class="form-input">
                <option value="">Selecciona una opción</option>
                <option value="evento">Programar un evento</option>
                <option value="cancion">Vender una canción</option>
                <option value="colaboracion">Colaboración</option>
                <option value="otro">Otro</option>
            </select>

        </div>

        <div id="opcionCancion" class="hidden">

            <label>
                ¿Para qué quieres la canción?
            </label>

            <select class="form-input">

                <option>Uso personal</option>
                <option>Video o contenido audiovisual</option>
                <option>Película o cortometraje</option>
                <option>Videojuego</option>
                <option>Publicidad</option>
                <option>Otro proyecto</option>

            </select>

        </div>

        <div id="opcionEvento" class="hidden">

            <label>
                ¿Qué tipo de evento es?
            </label>

            <select class="form-input">

                <option>Concierto</option>
                <option>Festival</option>
                <option>Evento privado</option>
                <option>Evento escolar</option>
                <option>Otro</option>

            </select>

        </div>

        <div>

            <label>Mensaje</label>

            <textarea
                class="form-input"
                rows="6"
                placeholder="Escribe tu mensaje">
            </textarea>

        </div>

        <button
            type="submit"
            class="bg-white text-black px-6 py-3 rounded-lg font-semibold">

            Enviar mensaje

        </button>

    </form>

</main>

<footer>
    <div class="max-w-6xl mx-auto px-6 py-8 text-gray-500 text-sm">
        © 2032 ZØREN
    </div>
</footer>

<script>

const tipo = document.getElementById("tipo");
const cancion = document.getElementById("opcionCancion");
const evento = document.getElementById("opcionEvento");

tipo.addEventListener("change", function() {

    cancion.classList.add("hidden");
    evento.classList.add("hidden");

    if (tipo.value === "cancion") {
        cancion.classList.remove("hidden");
    }

    if (tipo.value === "evento") {
        evento.classList.remove("hidden");
    }

});

</script>

</body>
</html>
