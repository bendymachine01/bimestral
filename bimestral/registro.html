<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZØREN | Registrarse</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-black text-white">

    <!-- MENÚ -->
    <header class="border-b border-gray-800">
        <nav class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">

            <a href="index.html" class="text-2xl font-bold">
                ZØREN
            </a>

            <div class="flex gap-6 text-gray-400">
                <a href="index.html" class="hover:text-white">Inicio</a>
                <a href="musica.html" class="hover:text-white">Música</a>
                <a href="eventos.html" class="hover:text-white">Eventos</a>
                <a href="galeria.html" class="hover:text-white">Galería</a>
                <a href="contacto.html" class="hover:text-white">Contacto</a>
            </div>

        </nav>
    </header>


    <!-- REGISTRO -->
    <main class="max-w-md mx-auto px-6 py-20">

        <div class="border border-gray-800 rounded-xl p-8">

            <h1 class="text-3xl font-bold mb-2">
                Crear cuenta
            </h1>

            <p class="text-gray-400 mb-8">
                Regístrate para acceder a las funciones de ZØREN.
            </p>


            <form class="space-y-6">

                <!-- NOMBRE -->
                <div>
                    <label for="nombre" class="block mb-2">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Tu nombre"
                        required
                        class="w-full bg-transparent border border-gray-700 rounded-lg px-4 py-3 outline-none focus:border-white">
                </div>


                <!-- CORREO -->
                <div>
                    <label for="correo" class="block mb-2">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="correo@ejemplo.com"
                        required
                        class="w-full bg-transparent border border-gray-700 rounded-lg px-4 py-3 outline-none focus:border-white">
                </div>


                <!-- CONTRASEÑA -->
                <div>
                    <label for="contraseña" class="block mb-2">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contraseña"
                        name="contraseña"
                        placeholder="Crea una contraseña"
                        required
                        class="w-full bg-transparent border border-gray-700 rounded-lg px-4 py-3 outline-none focus:border-white">
                </div>


                <!-- CONFIRMAR CONTRASEÑA -->
                <div>
                    <label for="confirmar" class="block mb-2">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar"
                        name="confirmar"
                        placeholder="Repite tu contraseña"
                        required
                        class="w-full bg-transparent border border-gray-700 rounded-lg px-4 py-3 outline-none focus:border-white">
                </div>


                <!-- BOTÓN -->
                <button
                    type="submit"
                    class="w-full bg-white text-black px-6 py-3 rounded-lg font-semibold hover:bg-gray-300">

                    Registrarme

                </button>

            </form>


            <p class="text-gray-500 text-sm text-center mt-6">
                ¿Ya tienes una cuenta?
                <a href="login.html" class="text-white hover:underline">
                    Iniciar sesión
                </a>
            </p>

        </div>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="border-t border-gray-800 py-8">

        <div class="max-w-6xl mx-auto px-6 text-gray-500 text-sm">
            © 2032 ZØREN. Todos los derechos reservados.
        </div>

    </footer>

</body>
</html>
